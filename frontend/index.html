<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- 글꼴: 고딕(Pretendard) = 기본 / 명조(Noto Serif KR) = 이야기 문장 (D-79) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- 공유 미리보기 (F-05): /s/{문장번호}로 들어오면 서버가 이 사이를 그 문장으로 바꿈 -->
    <!--share--><title>옛날 옛적에</title>
    <meta property="og:site_name" content="옛날 옛적에" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="옛날 옛적에" />
    <meta
      property="og:description"
      content="한 문장씩 이어 쓰는 이야기. 마음에 드는 갈래를 골라 읽고, 뒷이야기를 써 보세요."
    />
    <meta
      name="description"
      content="한 문장씩 이어 쓰는 이야기. 마음에 드는 갈래를 골라 읽고, 뒷이야기를 써 보세요."
    />
    <meta name="twitter:card" content="summary" /><!--/share-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
