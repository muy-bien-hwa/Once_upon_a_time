[project]
name = "backend"
version = "0.1.0"
description = "Once upon a time (릴레이 스토리) API 서버"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E4·E7·E9·F: 기본 오류 검사 / I: import 정렬 / UP: 최신 문법 / B: 버그 나기 쉬운 코드
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
